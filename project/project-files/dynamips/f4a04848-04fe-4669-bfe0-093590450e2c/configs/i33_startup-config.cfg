!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Chaguanas
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
ip name-server 8.8.8.8
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
ipv6 unicast-routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 ip address 60.30.33.22 255.255.255.252
 duplex auto
 speed auto
 ipv6 address 2001:81:60:40:58::2/80
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description to ISP1-CPE
 ip address 100.64.0.9 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 description to ISP2-CPE
 ip address 100.64.0.13 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet3/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router ospf 1
 log-adjacency-changes
 redistribute static subnets
 network 60.30.33.0 0.0.0.255 area 0
!
ip forward-protocol nd
ip route 8.50.0.0 255.255.0.0 100.64.0.10
ip route 8.50.0.0 255.255.0.0 100.64.0.14
ip route 8.76.0.0 255.255.0.0 100.64.0.10
ip route 8.76.0.0 255.255.0.0 100.64.0.14
ip route 10.0.0.0 255.0.0.0 100.64.0.10
ip route 10.0.0.0 255.0.0.0 100.64.0.14
ip route 81.60.40.0 255.255.255.0 100.64.0.10
ip route 81.60.40.0 255.255.255.0 100.64.0.14
ip route 100.64.0.0 255.255.255.0 100.64.0.10
ip route 100.64.0.0 255.255.255.0 100.64.0.14
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
ipv6 route ::/0 2001:81:60:40:58::1
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
