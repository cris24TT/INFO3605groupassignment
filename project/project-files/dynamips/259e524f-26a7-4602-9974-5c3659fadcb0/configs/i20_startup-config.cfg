!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R20
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
ip name-server 8.8.8.8
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
ipv6 unicast-routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 description to SWI
 ip address 8.8.8.1 255.255.255.0
 duplex auto
 speed auto
 ipv6 address 2001:81:60:40:52::1/80
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description to R21
 ip address 60.30.33.1 255.255.255.252
 duplex auto
 speed auto
 ipv6 address 2001:81:60:40:53::1/80
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet3/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router ospf 1
 log-adjacency-changes
 redistribute static subnets
 passive-interface FastEthernet0/0
 network 8.8.8.0 0.0.0.255 area 0
 network 60.30.33.0 0.0.0.255 area 0
!
ip forward-protocol nd
ip route 4.66.67.0 255.255.255.0 8.8.8.2
ip route 172.217.2.132 255.255.255.255 8.8.8.4
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
ipv6 route 2001:81:60:40::/64 2001:81:60:40:53::2
ipv6 route 2001:4860:482C:7700::/128 2001:81:60:40:52::4
ipv6 route 2001:4860:4860::8888/128 2001:81:60:40:52::8
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
