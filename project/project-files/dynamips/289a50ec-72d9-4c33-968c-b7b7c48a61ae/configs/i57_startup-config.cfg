!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname S1-R3
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
!
!
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface FastEthernet0/0
 description to POS-SW103 f1/5
 ip address 10.10.0.12 255.255.255.0
 speed 100
 duplex full
!
interface Serial0/0
 no ip address
 shutdown
 no fair-queue
 clock rate 2000000
!
interface FastEthernet0/1
 description to S1-R2 f1/0
 ip address 10.10.1.10 255.255.255.252
 speed 100
 duplex full
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 description to S12-R1 f0/1
 ip address 10.10.3.9 255.255.255.252
 speed 100
 duplex full
!
interface FastEthernet2/0
 description to S1-R9 f1/0
 ip address 10.10.1.41 255.255.255.252
 speed 100
 duplex full
!
interface FastEthernet3/0
 description to S1-R3-SW e0
 ip address 10.11.3.1 255.255.255.0
 speed 100
 duplex full
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router eigrp 816
 redistribute rip metric 100000 100 255 1 1500
 network 10.10.0.12 0.0.0.0
 no auto-summary
!
router rip
 version 2
 redistribute eigrp 816 metric 3
 passive-interface FastEthernet0/0
 passive-interface FastEthernet3/0
 network 10.0.0.0
 no auto-summary
!
ip forward-protocol nd
!
!
ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
line aux 0
line vty 0 4
 login
!
!
end
