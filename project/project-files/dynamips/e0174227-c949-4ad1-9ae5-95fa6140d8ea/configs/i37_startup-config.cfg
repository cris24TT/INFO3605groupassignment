!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname DC-R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
ip name-server 8.8.8.8
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 description to ISP1-CPE
 ip address 100.64.0.26 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description to ISP2-CPE
 ip address 100.64.0.30 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 description to DC-R2 Fa1/0
 ip address 10.0.99.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 description to DistributionFiber01 (core VLAN 1)
 ip address 10.0.1.1 255.255.255.0
 duplex auto
 speed auto
 standby 1 ip 10.0.1.254
 standby 1 priority 110
 standby 1 preempt
!
interface FastEthernet3/0
 description to DistributionFiber02 Fa1/0
 ip address 10.0.2.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router eigrp 816
 redistribute static metric 100000 100 255 1 1500
 network 10.0.1.0 0.0.0.255
 network 10.0.2.0 0.0.0.3
 network 10.0.99.0 0.0.0.3
 no auto-summary
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 100.64.0.25
ip route 0.0.0.0 0.0.0.0 100.64.0.29
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
