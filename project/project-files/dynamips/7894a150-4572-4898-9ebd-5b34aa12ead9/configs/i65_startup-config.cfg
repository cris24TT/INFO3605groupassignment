!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname S12-R2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
!
!
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface FastEthernet0/0
 description to S1-R9 f0/1
 ip address 10.10.3.5 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/0
 no ip address
 shutdown
 no fair-queue
 clock rate 2000000
!
interface FastEthernet0/1
 description to S12-R1 f1/0
 ip address 10.10.3.14 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 description to S2-R9 f0/1
 ip address 10.10.3.21 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 description trunk to SA-SW12
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet2/0.311
 encapsulation dot1Q 311
 ip address 8.50.46.17 255.255.255.252
!
interface FastEthernet2/0.321
 encapsulation dot1Q 321
 ip address 8.50.46.21 255.255.255.252
!
interface FastEthernet2/0.331
 encapsulation dot1Q 331
 ip address 8.50.46.25 255.255.255.252
!
interface FastEthernet2/0.341
 encapsulation dot1Q 341
 ip address 8.50.46.29 255.255.255.252
!
interface FastEthernet3/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router ospf 1
 log-adjacency-changes
 network 10.10.3.14 0.0.0.0 area 0
 network 10.10.3.21 0.0.0.0 area 0
!
router rip
 version 2
 passive-interface FastEthernet0/1
 passive-interface FastEthernet1/0
 passive-interface FastEthernet2/0.311
 passive-interface FastEthernet2/0.321
 passive-interface FastEthernet2/0.331
 passive-interface FastEthernet2/0.341
 network 8.0.0.0
 network 10.0.0.0
 no auto-summary
!
ip forward-protocol nd
!
!
ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
line aux 0
line vty 0 4
 login
!
!
end
