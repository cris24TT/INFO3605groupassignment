!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname DHCP
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 8.76.86.1 8.76.86.4
ip dhcp excluded-address 8.76.86.9 8.76.86.12
ip dhcp excluded-address 8.76.86.17 8.76.86.20
ip dhcp excluded-address 8.76.86.33 8.76.86.34
ip dhcp excluded-address 8.76.86.41 8.76.86.42
ip dhcp excluded-address 8.76.86.49
!
ip dhcp pool SB-311
   network 8.76.86.0 255.255.255.248
   default-router 8.76.86.3 
   dns-server 8.76.86.20 8.8.8.8 
   option 42 ip 123.123.123.123 
!
ip dhcp pool SB-321
   network 8.76.86.8 255.255.255.248
   default-router 8.76.86.11 
   dns-server 8.76.86.20 8.8.8.8 
   option 42 ip 123.123.123.123 
!
ip dhcp pool SB-331
   network 8.76.86.16 255.255.255.248
   default-router 8.76.86.19 
   dns-server 8.76.86.20 8.8.8.8 
   option 42 ip 123.123.123.123 
!
ip dhcp pool B102-311
   network 8.76.86.32 255.255.255.248
   dns-server 8.76.86.20 8.8.8.8 
   option 42 ip 123.123.123.123 
!
ip dhcp pool B102-321
   network 8.76.86.40 255.255.255.248
   default-router 8.76.86.41 
   dns-server 8.76.86.20 8.8.8.8 
   option 42 ip 123.123.123.123 
!
ip dhcp pool B102-331
   network 8.76.86.48 255.255.255.248
   default-router 8.76.86.49 
   dns-server 8.76.86.20 8.8.8.8 
   option 42 ip 123.123.123.123 
!
!
ip name-server 8.76.86.20
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface FastEthernet0/0
 description to SA-ToR-SWSBO1 e1 (VLAN 311)
 ip address 8.76.86.4 255.255.255.248
 duplex auto
 speed auto
!
interface Serial0/0
 no ip address
 shutdown
 no fair-queue
 clock rate 2000000
!
interface FastEthernet0/1
 description to SA-ToR-SWSBO2 (unused backup NIC)
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet3/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 8.76.86.3
!
!
ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
line aux 0
line vty 0 4
 login
!
ntp server 123.123.123.123
!
end
