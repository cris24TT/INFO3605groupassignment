interface FastEthernet0/0
 ip address 10.20.13.1 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 no switchport
 ip address 10.20.14.2 255.255.255.252
!
interface FastEthernet1/1
!
interface FastEthernet1/2
 no switchport
 ip address 10.20.3.1 255.255.255.0
!
interface FastEthernet1/3
 no switchport
 ip address 8.50.46.1 255.255.255.192
!
interface FastEthernet1/4
 no switchport
