!
router eigrp 816
 redistribute static
 network 10.20.3.0 0.0.0.255
 network 10.20.13.0 0.0.0.3
 network 10.20.14.0 0.0.0.3
 no auto-summary
!
router eigrp 40
 network 10.20.0.0 0.0.255.255
 auto-summary
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 10.20.3.2
!
!
ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
