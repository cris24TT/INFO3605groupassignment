!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname DistributionFiber05
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
!
!
ip name-server 8.76.86.20
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree vlan 311 priority 4096
spanning-tree vlan 321 priority 4096
spanning-tree vlan 331 priority 4096
spanning-tree vlan 341 priority 4096
!
!
! 
!
!
!
!
interface FastEthernet0/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 switchport mode trunk
!
interface FastEthernet1/1
 switchport mode trunk
!
interface FastEthernet1/2
 switchport trunk allowed vlan 1,311,321,331,341,1002-1005
 switchport mode trunk
!
interface FastEthernet1/3
 switchport trunk allowed vlan 1,311,321,331,341,1002-1005
 switchport mode trunk
!
interface FastEthernet1/4
!
interface FastEthernet1/5
!
interface FastEthernet1/6
!
interface FastEthernet1/7
!
interface FastEthernet1/8
!
interface FastEthernet1/9
!
interface FastEthernet1/10
!
interface FastEthernet1/11
!
interface FastEthernet1/12
!
interface FastEthernet1/13
!
interface FastEthernet1/14
!
interface FastEthernet1/15
!
interface Vlan1
 no ip address
!
interface Vlan311
 ip address 8.76.86.1 255.255.255.248
 standby 11 ip 8.76.86.3
 standby 11 priority 110
 standby 11 preempt
!
interface Vlan321
 ip address 8.76.86.9 255.255.255.248
 ip helper-address 8.76.86.4
 standby 21 ip 8.76.86.11
 standby 21 priority 110
 standby 21 preempt
!
interface Vlan331
 ip address 8.76.86.17 255.255.255.248
 ip helper-address 8.76.86.4
 standby 31 ip 8.76.86.19
 standby 31 priority 110
 standby 31 preempt
!
interface Vlan341
 ip address 8.76.86.25 255.255.255.248
 standby 41 ip 8.76.86.27
 standby 41 priority 110
 standby 41 preempt
!
router eigrp 816
 redistribute static metric 100000 100 255 1 1500
 network 8.76.86.0 0.0.0.31
 no auto-summary
!
ip forward-protocol nd
ip route 123.123.123.0 255.255.255.0 8.76.86.12
!
!
ip http server
no ip http secure-server
!
mac-address-table static 0000.0c07.ac15 interface FastEthernet1/2 vlan 321
mac-address-table static 0000.0c07.ac0b interface FastEthernet1/2 vlan 311
mac-address-table static 0000.0c07.ac29 interface FastEthernet1/2 vlan 341
mac-address-table static 0000.0c07.ac1f interface FastEthernet1/2 vlan 331
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line aux 0
line vty 0 4
 login
!
ntp server 123.123.123.123
!
end
